# ==============================================================================
# Nginx Configuration: ainews.danhiggins.org
# AI Industry News Daily — Signal Over Volume
# ==============================================================================

upstream ainews_backend {
    server 192.168.1.101:8000;
    keepalive 32;
}

# Optional: Enable this upstream if you prefer reverse proxying to Vite dev server
upstream ainews_frontend_dev {
    server 192.168.1.101:5173;
    keepalive 32;
}

server {
    server_name ainews.danhiggins.org;

    root /var/www/ainews.danhiggins.org/html;
    index index.html;

    # Gzip compression for high-performance delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;

    # Client upload size limit
    client_max_body_size 10m;

    # --------------------------------------------------------------------------
    # 1. API Reverse Proxy (FastAPI Backend)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://ainews_backend;
        proxy_http_version 1.1;

        # Keepalive and headers
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for longer LLM editorial generation / reviews
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 2. Static Asset Caching (Vite production hashed assets)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 3. Frontend SPA Routing (serves pre-built Vite index.html)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # Alternative: Dev Mode Reverse Proxy (Uncomment to proxy to Vite dev server)
    # --------------------------------------------------------------------------
    # location / {
    #     proxy_pass http://ainews_frontend_dev;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    listen 80;
    listen [::]:80;
}
